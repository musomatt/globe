<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02050c" />
    <meta name="description" content="A quiet Earth, suspended in blue. An ambient Three.js globe." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23152e53' stroke='%236ea1d3'/%3E%3C/svg%3E" />
    <title>Globe</title>
  </head>
  <body>
    <main aria-label="Earth in space">
      <canvas id="globe" aria-label="A slowly rotating Earth in space. Drag to rotate and scroll to zoom." tabindex="0"></canvas>
      <button id="fullscreen" type="button" aria-label="Enter fullscreen" title="Enter fullscreen" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
        </svg>
      </button>
      <p id="error" role="alert" hidden></p>
    </main>
    <noscript>This globe needs JavaScript to render.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
